logging.level.root=WARN


# Expose ONLY the health endpoint for hosting/load balancer health checks
management.endpoints.web.exposure.include=health

# Show details only when authorized, or set to 'never' to prevent information leakage
management.endpoint.health.show-details=when-authorized

# Optional: Run actuator on a separate management port for extra security (not publicly accessible)
# management.server.port=8081