<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TagLens</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <div class="logo">
        📷 TagLens
    </div>

    <nav>

        <button id="homeBtn">
            Home
        </button>

        <button id="myImagesBtn">
            My Images
        </button>

        <button id="loginBtn">
            Login
        </button>

        <button id="registerBtn">
            Register
        </button>

        <button id="logoutBtn">
            Logout
        </button>

    </nav>

</header>


<section class="hero">

    <h1>AI Image Hosting</h1>

    <p>
        Upload images. Let AI describe them. Search anything.
    </p>

</section>


<section class="search">

    <input
            id="searchInput"
            placeholder="Search by tags..."
    >

    <button id="searchBtn">
        Search
    </button>

</section>


<section class="upload">

    <input
            type="file"
            id="imageInput"
            accept="image/*"
    >

    <button id="uploadBtn">
        Upload
    </button>

</section>


<section id="gallery" class="gallery">

</section>

<script src="app.js"></script>

</body>
</html>
