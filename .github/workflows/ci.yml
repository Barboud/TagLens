name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode verify
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/testdb
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          B2_ACCESS_KEY: test-key-not-real
          B2_SECRET_KEY: test-secret-not-real
          B2_BUCKET_NAME: test-bucket
          LOKI_URL: http://localhost:3100
          LOKI_USERNAME: dummy
          LOKI_API_TOKEN: dummy
          GITHUB_MODELS_TOKEN: dummy

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image
        run: >
          docker build
          -t ghcr.io/barboud/taglens:latest
          -t ghcr.io/barboud/taglens:${{ github.sha }}
          .
      - name: Push image
        run: docker push --all-tags ghcr.io/barboud/taglens

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK }}"